[project]
name = "ai-route-dispatcher"
version = "0.1.0"
description = "Vehicle routing optimizer (OR-Tools) with an AI dispatcher for beverage distribution: capacities, time windows, returnable empties, access zones, intraday re-planning, Serbian commands, human approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "anthropic>=0.70",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dispatcher = "dispatcher.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispatcher*"]

[tool.setuptools.package-data]
dispatcher = ["eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
